<!doctype html>
<meta charset="utf-8">
<title>Login</title>

<h1>Login</h1>

<label>Username: <input id="u" autocomplete="username"></label><br><br>
<label>Password: <input id="p" type="password" autocomplete="current-password"></label><br><br>

<button id="btn" type="button">Login</button>
<p id="msg"></p>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('btn');
  const u = document.getElementById('u');
  const p = document.getElementById('p');
  const msg = document.getElementById('msg');

  btn.addEventListener('click', async () => {
    msg.textContent = "Logging in...";

    // endpoint must match Main.java
    const endpoint = "/api/login"; 

    try {
      const r = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u.value.trim(), password: p.value })
      });

      const text = await r.text();
      let j;
      try { j = JSON.parse(text); } catch { j = { ok:false, error:text }; }

      if (r.ok && j.ok) {
        msg.textContent = "Success! Redirecting...";
        window.location = "/directory.html";
      } else {
        msg.textContent = `ERROR (${r.status}): ` + (j.code || j.error || "Login failed");
      }
    } catch (e) {
      msg.textContent = "Network/JS error: " + e;
    }
  });
});
</script>
